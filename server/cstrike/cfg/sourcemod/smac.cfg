// Настройка метода логирования античита. Режим "0" - логи античита пишутся в один файл: "\cstrike\addons\sourcemod\logs\SMAC.log".
// Режим "1" - логи античита пишутся в отдельные файлы с префиксом даты: "\cstrike\addons\sourcemod\logs\07-10-2016_SMAC.log".
// -
// Default: "1"
// Minimum: "0.000000"
// Maximum: "1.000000"
smac_log_ViewType "1"

// [001_SMAC_Rcon.smx] "Enable or disable the command logging functionality. (0:Disabled; 1:Enabled)
// Настройка функции ведения журнала команд сервера. Режим "1" - логи команд пишутся в файл с префиксом даты: "\cstrike\addons\sourcemod\logs\cmd_11.08.17.log".
// Подробное логирования всех команд, которые выполняются на сервере.
// -
// Default: "0"
// Minimum: "0.000000"
// Maximum: "1.000000"
smac_Con_Logs "0"

// [001_SMAC_Global.smx] Show Status: (0:Normal, 1:Only your Status)
// Настройка режима отображения информации команды Status.
// При значении "0" - стандартное отображение информации ("Статус" по всем игрокам на сервере). При значении "1" - вывод информации "Статус" только по одному игроку, кто дал команду "status".
// -
// Default: "1"
// Minimum: "0.000000"
// Maximum: "1.000000"
smac_show_status "1"

// [001_SMAC_Global.smx] Status and Ping in Server: (-1:Disable, 0:Normal, 1:Already Protected)
// Настройка режима защиты команд Status и Ping.
// При значении "-1" - отключить защиту античита, при значении "0" - стандартная защита, при значении "1" - защита для версии CSS с изменёнными бинарниками.
// Включение защиты может влиять на доступ к функциям SourceBans.
// -
// Default: "1"
// Minimum: "-1.000000"
// Maximum: "1.000000"
smac_status_ping_prot "-1"

// [001_SMAC_Client.smx] Blocking the execution of some commands using sm_cvar and sm_rcon. (0:Disabled, 1:Admin notices, 2:Kick, 3:Ban, 4:Admin notices + SMAC, 5:Kick + SMAC, 6:Ban + SMAC)
// Настройка режима защиты от испрользования команд с участием "sm_cvar" и "sm_rcon". Блокирует выполнение команд на сервере и банит того, кто пытается использовать эти команды на сервере под админкой.
// Защита действует на попытки смены названия и gamedesc_override сервера, смены имени SourceTV, установку любых паролей, попытки переименования ботов, попытки выключения или рестарта сервера.
// Подразумевается, что нет нужды в оперативном изменении этих параметров с помощью админ прав и использованием команд "sm_cvar" и "sm_rcon". Квар "smac_Lock_Adm" имеет защиту от коррекции.
// Вы можете сделать все оперативные вмешательства на рабочем сервере (выполнение команд на сервере) только с использованием консоли сервера в ПУ сервером.
// Режимы 4, 5, 6 эквивалентны режимам 1, 2, 3, но добавляется реакция на любые попытки управления античитом - блокируется выполнение любых команд с использованием префикса "smac_" под админкой.
// Значение для smac_Lock_Adm устанавливается ТОЛЬКО из конфига античита. Вы не можете оперативно изменить эту настройку даже с использованием консоли сервера в ПУ сервером.
// -
// Default: "6"
// Minimum: "0.000000"
// Maximum: "6.000000"
smac_Lock_Adm "6"

// [001_SMAC_Core.smx] Display a message saying that your server is protected.
// Включить или выключить сообщение в чате о защите сервера античитом при подключении игрока на сервер.
// -
// Default: "1"
// Minimum: "0.000000"
// Maximum: "1.000000"
smac_welcomemsg "0"

// [001_SMAC_Global.smx] Enable Anti-Wallhack. This will increase your server's CPU usage. (0:Disable, 1:Normal Mode, 2:FFA Mode, Radar OFF)
// Настройка режима защиты модуля Anti-WallHack (Anti-WH).
// Значение 0 - Выключить защиту; 1 - Включить стандартный режим защиты Anti-WH (Радар включен, защита Anti-WallHack для игроков противоположных команд за препятствиями);
// 2 - Включить режим защиты Anti-WH для FFA (Радар выключен, защита Anti-WallHack для всех игроков (противников) за препятствиями).
// -
// Default: "1"
// Minimum: "0.000000"
// Maximum: "2.000000"
smac_wallhack "1"

// [001_SMAC_Global.smx] Degree of rigidity of the module Anti-Wallhack. (Easy < 0.0:Disabled > Hard)
// Уровень (жёсткость) режима защиты модуля Anti-WallHack (Anti-WH). При отрицательном значении квара эффект защиты Anti-Wallhack будет "мягче", защита будет включаться с задержкой и отключаться заранее.
// При положительном значении квара эффект защиты Anti-Wallhack будет "жёстче", защита будет включаться быстрее и отключаться позже. При значении квара "0.0" - коррекции модуля Anti-Wallhack нет, работают дефолтные настройки античита.
// Положительные значения данного квара рекомендуются для CW и турнирных серверов. Отрицательные значения данного квара рекомендуются для серверов v89, а также на серверах, где пинги у игроков имеют большой разброс и большие значения.
// -
// Default: "0"
// Minimum: "-3.000000"
// Maximum: "3.000000"
smac_wallhack_Level "0.0"

// [001_SMAC_Global.smx] The response time of the Anti-Wallhack module.
// Скорость срабатывания модуля защиты Anti-WallHack (Anti-WH). Чем меньше это значение, тем быстрее будет реакция модуля защиты Anti-Wallhack, лучше эффект защиты от Wallhack и выше нагрузка на процессор сервера.
// -
// Default: "0.15"
// Minimum: "0.100000"
// Maximum: "0.400000"
smac_wallhack_Time "0.2"

// ***************************************************************************************
// Ниже находятся квары модулей детектов, которые будут работать ТОЛЬКО при включенном модуле Anti-Wallhack, то есть квар smac_wallhack должен быть больше "0".
// Эти модули работают по новому принципу работы античита "Strike Back".

// [001_SMAC_Global.smx] Enable Anti-SoundESP. (-1:Disable, 0 - 4: Activate Protection)
// Настройка режима защиты модуля Anti-SoundESP (Anti Sound ESP).
// -1 - Полностью отключить модуль обработки звуков античитом. При включенном модуле Anti-Wallhack возможны "подавления" звука, если противники не видят друг друга. Защита от Anti-SoundESP отсутствует.
// 0 - режим защиты Anti-SoundESP, когда координаты источника звука - подлинные, данные в канале звука - от источника звука. Служит для исправления "подавления" звука при включенном модуле Anti-Wallhack. Защита от Anti-SoundESP отсутствует.
// 1 - режим защиты Anti-SoundESP, когда координаты источника звука - ложные, данные в канале звука - от источника звука. Минимальная защита.
// 2 - режим защиты Anti-SoundESP, когда координаты источника звука - ложные, данные в канале звука - частичные от источника звука.
// 3 - режим защиты Anti-SoundESP, когда координаты источника звука - подлинные, данные в канале звука - ложные.
// 4 - режим защиты Anti-SoundESP, когда координаты источника звука - ложные, данные в канале звука - ложные. Максимальная защита.
// Защита Anti-SoundESP работает, если включен модуль Anti-WallHack. Защита Anti-SoundESP включается, если противники не видят друг друга (между ними препятствия) и отключается при прямом визуальном контакте противников.
// -
// Default: "2.0"
// Minimum: "-1.000000"
// Maximum: "4.000000"
smac_SoundESP "0.0"

// [001_SMAC_Global.smx] Enable AIM Kill mode. (0:Disable, 1, 2: Activate Protection)
// Настройка режима защиты модуля Убийца AIM (AIM Kill). Значение 0 - Выключить защиту.
// Значение 1 - Оптимально достаточнный уровень защиты (минимальное потребление ресурсов), Значение 2 - Максимальный уровень защиты (потребление ресурсов).
// -
// Default: "1.0"
// Minimum: "0.000000"
// Maximum: "2.000000"
smac_AIM_Kill "1.0"

// [001_SMAC_Global.smx] Number of KnifeBot detections (Using SMAC WH) before a player is Warning. (0:Never Warning)
// Количество детектов KnifeBot detections, после которого администратор начинает видеть уведомления в чате.
// Модули античита, которые подчиняются этому параметру: (KnifeBot).
// -
// Default: "1"
// Minimum: "0.000000"
// Maximum: "100.000000"
smac_KnifeBot_UsingWH_Warning "1"

// [001_SMAC_Global.smx] Number of KnifeBot detections (Using SMAC WH) before a player is banned. (Kick < 0:Disabled > Ban)
// Количество детектов KnifeBot detections, после которого игрок получает кик или бан.
// Модули античита, которые подчиняются этому параметру: (KnifeBot).
// При значении "0" - модули детектов отключаются, при значении "-", например "-2", после 2 детектов следует кик игрока, при значении "+", например "2", после 2 детектов следует бан игрока.
// -
// Default: "2"
// Minimum: "-100.000000"
// Maximum: "100.000000"
smac_KnifeBot_UsingWH_Ban "4"

// [001_SMAC_Global.smx] Number of AimBot detections (Analysis Module Shooting using SMAC WH) before a player is Warning. (0:Never Warning)
// Количество детектов автоматической наводки AimBot (Analysis Module Shooting using SMAC WH), после которого администратор начинает видеть уведомления в чате.
// Модули античита, которые подчиняются этому параметру: 102, 103.
// -
// Default: "2"
// Minimum: "0.000000"
// Maximum: "100.000000"
smac_aimbot_UsingWH_Warning_AMS "3"

// [001_SMAC_Global.smx] Number of AimBot detections (Analysis Module Shooting using SMAC WH) before a player is banned. (Kick < 0:Disabled > Ban)
// Количество детектов автоматической наводки AimBot (Analysis Module Shooting using SMAC WH), после которого игрок получает кик или бан.
// Модули античита, которые подчиняются этому параметру: 102, 103.
// При значении "0" - модули детектов отключаются, при значении "-", например "-5", после 5 детектов следует кик игрока, при значении "+", например "5", после 5 детектов следует бан игрока.
// -
// Default: "3"
// Minimum: "-100.000000"
// Maximum: "100.000000"
smac_aimbot_UsingWH_Ban_AMS "6"

